# v ile başlayan bir etiket push'lanınca (ör. v1.0.0) uygulamayı derler ve GitHub Releases'a zip olarak koyar.
# Elle çalıştırıldığında (Actions → Release → Run workflow) zip'i sadece "artifact" olarak yükler.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derle (Intel + Apple Silicon)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          swift --version
          ./build.sh --universal --zip

      - name: Zip'i sakla
        uses: actions/upload-artifact@v4
        with:
          name: SecretBot
          path: dist/*.zip

      - name: Sürümü yayınla
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Secret Bot $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --generate-notes
